name: Build app

on:
  push:
    branches: [master]
    paths: [app.py, txt2mp3srt.py, .github/workflows/build-app.yml]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要建立的 Release 版本（例如 v1.0），留空則只打包"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: txt2mp3srt-windows.zip
          - os: macos-latest
            asset: txt2mp3srt-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller certifi

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed --name txt2mp3srt --hidden-import certifi app.py
          Compress-Archive -Path dist/txt2mp3srt.exe -DestinationPath ${{ matrix.asset }}

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name txt2mp3srt --hidden-import certifi app.py
          ditto -c -k --keepParent dist/txt2mp3srt.app ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: cp src/index.html txt2mp3srt-web.html
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release_tag || github.ref_name }}
          body: |
            旁白稿批次轉 MP3 + SRT（ElevenLabs）

            - **Windows**：下載 `txt2mp3srt-windows.zip`，解壓縮後雙擊 `txt2mp3srt.exe`
            - **macOS（M 系列晶片）**：下載 `txt2mp3srt-macos.zip`，解壓縮後打開 `txt2mp3srt.app`

            程式沒有程式碼簽章，第一次開啟時：
            - Windows 出現「Windows 已保護您的電腦」→ 按「其他資訊」→「仍要執行」
            - macOS 出現「無法打開」→ 在 app 上按右鍵 →「打開」→ 再按「打開」

            - **網頁版**：下載 `txt2mp3srt-web.html`，用 Chrome 或 Edge 開啟
          files: |
            txt2mp3srt-windows.zip
            txt2mp3srt-macos.zip
            txt2mp3srt-web.html
